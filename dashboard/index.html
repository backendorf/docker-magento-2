<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAGENV — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'%3E%3Cpath d='M37.5 19.5 L62.5 62.5 H12.5 Z' stroke='%23da1f26' stroke-width='8' stroke-linejoin='round'/%3E%3Cpolygon points='67.5,34.5 87.5,46 87.5,69 67.5,80.5 47.5,69 47.5,46' stroke='%23f46f25' stroke-width='8' stroke-linejoin='round'/%3E%3C/svg%3E">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Initial Dark Mode Injection to prevent flicker -->
  <script>
    if (localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  </script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="header-left">
      <div class="logo-text">
        <span class="orange-1">MAG</span><span class="orange-2">ENV</span>
      </div>
      <div class="status-badge">
        <span id="header-status-dot" class="status-dot"></span>
        <span id="title">magenv</span>
      </div>
    </div>
    
    <div class="header-right">
      <button onclick="toggleTheme()" class="btn-icon" title="Toggle dark/light mode">
        <svg id="theme-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Scrollable Dashboard Content -->
  <main>
    
    <!-- Services Section -->
    <section>
      <h3 class="section-title">Services</h3>
      <div class="services-grid" id="cards">
        <!-- Injected dynamically by app.js -->
      </div>
    </section>

    <!-- Information and Utilities Section -->
    <section>
      <div class="tabs-container">
        <div class="tabs-nav">
          <button onclick="switchMainTab('tab-commands')" id="btn-tab-commands" class="tab-nav-btn active">Quick Commands</button>
          <button onclick="switchMainTab('tab-install')" id="btn-tab-install" class="tab-nav-btn">Guided Installation</button>
          <button onclick="switchMainTab('tab-skills')" id="btn-tab-skills" class="tab-nav-btn">IA Skills</button>
          <button onclick="switchMainTab('tab-faq')" id="btn-tab-faq" class="tab-nav-btn">FAQ</button>
        </div>

        <!-- Tab Panel: Quick Commands -->
        <div id="tab-commands" class="tab-content-panel active">
          <div class="commands-list" id="howto">
            <!-- Injected dynamically by app.js -->
          </div>
        </div>

        <!-- Tab Panel: Guided Installation Steps -->
        <div id="tab-install" class="tab-content-panel">
          <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 16px;">
            Run <code style="font-size: 0.8em;">./magenv install</code> in your terminal to begin the configuration workflow.
          </div>
          <div class="installation-grid" id="install-options">
            <!-- Injected dynamically by app.js -->
          </div>
        </div>

        <!-- Tab Panel: IA Skills -->
        <div id="tab-skills" class="tab-content-panel">
          <div class="coming-soon-wrapper">
            <span class="coming-soon-label">Coming Soon</span>
          </div>
        </div>

        <!-- Tab Panel: FAQ Accordion -->
        <div id="tab-faq" class="tab-content-panel">
          <div class="faq-list" id="faq">
            <!-- Injected dynamically by app.js -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <span>Made with 🇧🇷 in Brazil</span>
    <a href="https://github.com/backendorf/magenv" target="_blank" class="footer-link">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24" style="display: block;">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.34-3.369-1.34-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
      </svg>
      <span>backendorf/magenv</span>
    </a>
  </footer>

  <!-- Dialog Modal -->
  <div id="modal" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-backdrop"></div>
    <div id="modal-box" class="modal-wrapper">
      <div class="modal-header">
        <div class="modal-header-content" id="modal-header">
          <!-- Injected dynamically -->
        </div>
        <button onclick="closeModal()" class="modal-close-btn" title="Close dialog">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Config and Application Scripts -->
  <script src="/config.js"></script>
  <script src="app.js"></script>
</body>
</html>
